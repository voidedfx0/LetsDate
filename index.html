<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#160914">
<title>For KHALEESI ❤️</title>
<style>
:root{color-scheme:dark;--pink:#ff9dc9;--rose:#ff5c9a;--text:#fff4fa;--muted:#d8b5c7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:18px;background:radial-gradient(ellipse at 12% 12%,#54213e 0,transparent 36%),radial-gradient(ellipse at 88% 88%,#41162e 0,transparent 38%),#130a12;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.ambient{position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(95px);opacity:.18;pointer-events:none;background:#ff367d}.ambient.a{top:-150px;left:-100px}.ambient.b{right:-140px;bottom:-140px;background:#b43aff}
.star-field{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.tiny-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff7fc;box-shadow:0 0 8px 2px #ff8fbd;opacity:0;animation:twinkle var(--twinkle-duration,3s) ease-in-out var(--twinkle-delay,0s) infinite;will-change:opacity,transform}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.35)}35%{opacity:.12;transform:scale(.65)}50%{opacity:1;transform:scale(1.3)}65%{opacity:.15;transform:scale(.7)}}
.card{position:relative;z-index:2;width:min(100%,520px);max-height:calc(100svh - 36px);overflow-y:auto;overflow-x:hidden;padding:clamp(18px,3vh,30px) clamp(20px,6vw,44px);text-align:center;overscroll-behavior:contain;border:1px solid #ff9dc944;border-radius:28px;background:#21111ef5;box-shadow:0 18px 70px #0006,0 0 38px #ff4b8a18;animation:float 5s ease-in-out infinite,cardGlow 3s ease-in-out infinite!important}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes cardGlow{0%,100%{border-color:#ff9dc922;box-shadow:0 18px 70px #0006,0 0 12px #ff4b8a08}50%{border-color:#ff9dc9cc;box-shadow:0 18px 70px #0006,0 0 34px #ff4b8a45,0 0 58px #ff8fbd20}}
.heart{font-size:2.5rem;line-height:1.2;margin-bottom:12px;filter:drop-shadow(0 0 13px #ff5c9a80);animation:beat 1.8s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.09)}}
.eyebrow{margin:0 0 12px;color:var(--pink);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
h1{font:500 clamp(2.15rem,8vw,3.25rem)/1.08 Georgia,serif;margin:0 0 16px}h1 span{color:var(--pink);font-style:italic}
.question{max-width:370px;margin:0 auto 20px;font-size:clamp(1.05rem,4vw,1.25rem);line-height:1.6;color:#ffe5f0}
.button-area{min-height:76px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;position:static}
button{font:inherit;font-weight:650;border-radius:999px;border:1px solid transparent;padding:13px 22px;cursor:pointer;touch-action:manipulation;transition:transform .18s,background .18s}
button:focus-visible{outline:2px solid white;outline-offset:4px}
.primary{color:#350b20;background:linear-gradient(135deg,#ffc1dd,#ff6ba7);box-shadow:0 7px 22px #ff4b8a28}.primary:hover{transform:translateY(-2px)}
.secondary{color:#ffe5f0;background:#ffffff08;border-color:#ff9dc955}
.next{color:white;background:linear-gradient(135deg,#ff548f,#d92e68)}
.back-small{display:inline-flex;align-items:center;gap:5px;margin:0 auto 18px;padding:8px 14px;font-size:.82rem;font-weight:600;color:#ffe5f0;background:#ffffff0c;border:1px solid #ff9dc977;box-shadow:none}
.hint{font-size:.82rem;color:var(--muted);margin:13px 0 0}.progress{margin-top:22px;font-size:.68rem;letter-spacing:.17em;color:#b88ba2}
.message{white-space:pre-line;line-height:1.85;color:#ffe5f0;margin:20px 0 25px;font-size:1rem}.hidden{display:none!important}
.floating-heart{position:fixed;bottom:-30px;z-index:1;pointer-events:none;opacity:0;animation:rise linear forwards;color:#ff8dbb;text-shadow:0 0 12px #ff367d}
@keyframes rise{15%{opacity:.55}100%{transform:translateY(-110svh);opacity:0}}
@media(max-width:420px){.card{border-radius:23px;padding:24px 19px}.button-area{gap:10px}button{padding:12px 18px}}
@media(prefers-reduced-motion:reduce){.heart{animation:none}.card{animation:float 5s ease-in-out infinite,cardGlow 3s ease-in-out infinite!important}}
</style>
</head>
<body>
<div class="ambient a" aria-hidden="true"></div><div class="ambient b" aria-hidden="true"></div>
<div class="star-field" id="star-field" aria-hidden="true"></div>
<main class="card" aria-live="polite">
<section id="question-screen">
<div class="heart">♥</div><p class="eyebrow">A little question from my heart</p>
<h1>Hey, <span>KHALEESI</span>…</h1>
<p class="question" id="question-text">Will you go on a date with me? ❤️</p>
<div class="button-area"><button class="primary" id="yes-button" type="button">Yes, of course! 💖</button><button class="secondary" id="no-button" type="button">No 🙈</button></div>
<p class="hint" id="hint">Choose carefully, my love 🌹</p><div class="progress">QUESTION 01</div>
</section>
<section id="message-screen" class="hidden">
<button class="back-small" id="message-back-button" type="button">← Back</button>
<div class="heart">💗</div><p class="eyebrow">You just made my day</p><h1>Yaaay, <span>my love!</span></h1>
<p class="message" id="romantic-message"></p><button class="next" id="next-button" type="button">Next: Question 2 💌</button><div class="progress">MADE WITH LOVE ♥</div>
</section>
<section id="later-screen" class="hidden">
<button class="back-small" id="later-back-button" type="button">← Back</button>
<div class="heart">💌</div><p class="eyebrow">Our little love story</p><h1>More questions, <span>more memories</span></h1>
<p class="question">Question 2 is waiting for us. ❤️</p><button class="next" id="back-button" type="button">Back to Question 1 ↺</button><div class="progress">TO BE CONTINUED…</div>
</section>
</main>
<script>
const loveMessage="My love, ❤️🥹\n\nYou have no idea how happy you make me. Just the thought of spending a beautiful moment with you makes me smile. 💕🌹\n\nIf I could choose one place to be, it would be right beside you. I want to see your smile, hear your laughter, look into your eyes, and create beautiful memories together.\n\nYou and me, a date to remember. 🌹❤️";
document.getElementById("romantic-message").textContent=loveMessage;
const questionScreen=document.getElementById("question-screen"),messageScreen=document.getElementById("message-screen"),laterScreen=document.getElementById("later-screen"),noButton=document.getElementById("no-button"),hint=document.getElementById("hint");
let dodges=0;
function resetQuestion(){questionScreen.classList.remove("hidden");messageScreen.classList.add("hidden");laterScreen.classList.add("hidden");noButton.style.display="";noButton.style.position="";noButton.style.left="";noButton.style.top="";noButton.style.right="";noButton.style.bottom="";noButton.style.transform="";noButton.style.zIndex="";noButton.style.margin="";hint.textContent="Choose carefully, my love 🌹";dodges=0}
function dodgeNo(e){if(e)e.preventDefault();const r=noButton.getBoundingClientRect(),pad=12;const maxX=Math.max(pad,innerWidth-r.width-pad),maxY=Math.max(pad,innerHeight-r.height-pad);const x=pad+Math.random()*(maxX-pad),y=pad+Math.random()*(maxY-pad);noButton.style.position="fixed";noButton.style.left=Math.min(maxX,Math.max(pad,x))+"px";noButton.style.top=Math.min(maxY,Math.max(pad,y))+"px";noButton.style.right="auto";noButton.style.bottom="auto";noButton.style.transform="none";noButton.style.zIndex="10";noButton.style.margin="0";dodges++;hint.textContent=dodges<4?"Hehe… try catching me! 🙈💕":"Someone really wants to say YES 😘"}
noButton.addEventListener("pointerenter",dodgeNo);noButton.addEventListener("pointerdown",dodgeNo);
function heartBurst(){for(let i=0;i<18;i++){const h=document.createElement("span");h.className="floating-heart";h.textContent=["♥","♡","💕","💗"][Math.floor(Math.random()*4)];h.style.left=(35+Math.random()*30)+"vw";h.style.fontSize=(14+Math.random()*15)+"px";h.style.animationDuration=(3+Math.random()*3)+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),6500)}}
document.getElementById("yes-button").addEventListener("click",()=>{questionScreen.classList.add("hidden");messageScreen.classList.remove("hidden");noButton.style.display="none";heartBurst()});
document.getElementById("next-button").addEventListener("click",()=>{messageScreen.classList.add("hidden");laterScreen.classList.remove("hidden")});
document.getElementById("message-back-button").addEventListener("click",resetQuestion);
document.getElementById("later-back-button").addEventListener("click",()=>{laterScreen.classList.add("hidden");messageScreen.classList.remove("hidden")});
document.getElementById("back-button").addEventListener("click",resetQuestion);
function placeStars(){const field=document.getElementById("star-field");if(!field)return;field.replaceChildren();const count=Math.min(100,Math.max(55,Math.floor(innerWidth*innerHeight/8500)));const card=document.querySelector(".card").getBoundingClientRect();let placed=0,attempts=0;while(placed<count&&attempts<count*8){attempts++;const x=Math.random()*innerWidth,y=Math.random()*innerHeight;if(x>card.left-5&&x<card.right+5&&y>card.top-5&&y<card.bottom+5)continue;const star=document.createElement("span");star.className="tiny-star";star.style.left=x+"px";star.style.top=y+"px";star.style.setProperty("--twinkle-delay",(Math.random()*5)+"s");star.style.setProperty("--twinkle-duration",(1.8+Math.random()*3.2)+"s");const size=1.5+Math.random()*2.5;star.style.width=size+"px";star.style.height=size+"px";field.appendChild(star);placed++}}
placeStars();addEventListener("resize",placeStars);
setInterval(()=>{if(Math.random()>.4)return;const h=document.createElement("span");h.className="floating-heart";h.textContent=["♡","♥"][Math.floor(Math.random()*2)];h.style.left=Math.random()*100+"vw";h.style.fontSize=(12+Math.random()*10)+"px";h.style.animationDuration=(8+Math.random()*5)+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),14000)},1800);
</script>
</body>
</html>
